name: illunis
description: "Illunis — lifestyle pattern detection under a real sky."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # State. The sky reads one immutable SkyState; providers own who writes it.
  flutter_riverpod: ^3.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The whole sky is one fragment program. Declared here so impellerc compiles
  # it for every target; loaded by core/sky/sky_shader.dart.
  shaders:
    - shaders/sky.frag

  # Inter carries text. JetBrains Mono carries every figure and every label
  # that reads as an instrument — tabular by construction.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
