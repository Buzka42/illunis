name: illunis
description: "Illunis — lifestyle pattern detection under a real sky."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  path_provider: ^2.1.5
  path: ^1.9.1
  http: ^1.5.0
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sky/clouds/

  # Native sky and weather passes, compiled for each target.
  shaders:
    - shaders/sky.frag
    - shaders/weather.frag

  # Inter carries text. JetBrains Mono carries every figure and every label
  # that reads as an instrument — tabular by construction.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
